<!DOCTYPE html>
<html>

<head>
  <title>Avatar Size</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample avatar-overview-sample">
      <div class="avatar-variant">
        <span class="avatar-with-badge">
          <igc-avatar
            class="size-large"
            shape="circle"
            src="https://dl.infragistics.com/x/img/avatars/avatar-profile-05.png"
            alt="A profile photo of a man."
          ></igc-avatar>
          <igc-badge
            class="avatar-status avatar-dot-badge size-large"
            dot
            outlined
            variant="success"
          ></igc-badge>
        </span>
        <span class="avatar-label">Large</span>
      </div>

      <div class="avatar-variant">
        <span class="avatar-with-badge">
          <igc-avatar
            class="size-medium"
            shape="circle"
            src="https://dl.infragistics.com/x/img/avatars/avatar-profile-03.png"
            alt="A profile photo of a man."
          ></igc-avatar>
          <igc-badge
            class="avatar-status avatar-dot-badge size-medium"
            dot
            outlined
            variant="success"
          ></igc-badge>
        </span>
        <span class="avatar-label">Medium</span>
      </div>

      <div class="avatar-variant">
        <span class="avatar-with-badge">
          <igc-avatar
            class="size-small"
            shape="circle"
            src="https://dl.infragistics.com/x/img/avatars/avatar-profile-04.png"
            alt="A profile photo of a man."
          ></igc-avatar>
          <igc-badge
            class="avatar-status avatar-dot-badge size-small"
            dot
            outlined
            variant="success"
          ></igc-badge>
        </span>
        <span class="avatar-label">Small</span>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
