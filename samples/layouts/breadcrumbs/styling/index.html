<!DOCTYPE html>
<html>

<head>
  <title>Breadcrumbs Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <nav aria-label="Breadcrumb">
        <igc-breadcrumbs separator="music_note">
          <igc-breadcrumb>
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
          </igc-breadcrumb>
          <igc-breadcrumb><a href="/home/item">Item</a></igc-breadcrumb>
          <igc-breadcrumb><a href="/home/item/item">Item</a></igc-breadcrumb>
          <igc-breadcrumb><a href="/home/item/item/item">Item</a></igc-breadcrumb>
          <igc-breadcrumb current><a href="/home/item/item/item/current">Current Item</a></igc-breadcrumb>
        </igc-breadcrumbs>
      </nav>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
