<!DOCTYPE html>
<html>

<head>
  <title>Breadcrumbs Overview</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <nav aria-label="Breadcrumb">
        <igc-breadcrumbs>
          <span>Idle</span>
          <igc-breadcrumb>
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Hover</span>
          <igc-breadcrumb class="state-hover">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Focused</span>
          <igc-breadcrumb class="state-focused">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Pressed</span>
          <igc-breadcrumb class="state-pressed">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Focused & Hover</span>
          <igc-breadcrumb class="state-focused-hover">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Focused & Pressed</span>
          <igc-breadcrumb class="state-focused-pressed">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
        <igc-breadcrumbs>
          <span>Disabled</span>
          <igc-breadcrumb class="state-disabled">
            <igc-icon slot="prefix" name="home"></igc-icon>
            <a href="/home">Home</a>
            <igc-icon slot="suffix" name="home"></igc-icon>
          </igc-breadcrumb>
        </igc-breadcrumbs>
      </nav>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
