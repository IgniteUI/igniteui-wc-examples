<!DOCTYPE html>
<html>

<head>
  <title>Virtual Scroll Scroll to Index</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="container sample">
      <div class="toolbar">
        <igc-input id="targetIndex" class="toolbar__index" type="number" label="Index" min="0" value="50000"></igc-input>
        <igc-radio-group id="alignment" alignment="horizontal">
          <igc-radio name="alignment" value="start" checked>start</igc-radio>
          <igc-radio name="alignment" value="center">center</igc-radio>
          <igc-radio name="alignment" value="end">end</igc-radio>
          <igc-radio name="alignment" value="nearest">nearest</igc-radio>
        </igc-radio-group>
        <div class="toolbar__actions">
          <igc-button id="go">Go</igc-button>
          <igc-button id="first" variant="outlined">First</igc-button>
          <igc-button id="middle" variant="outlined">Middle</igc-button>
          <igc-button id="last" variant="outlined">Last</igc-button>
          <igc-button id="random" variant="outlined">Random</igc-button>
        </div>
      </div>
      <igc-list class="employees">
        <igc-list-header>Employees (<span id="count"></span>)</igc-list-header>
        <igc-virtual-scroll id="virtualScroll" class="employees__viewport" estimated-item-size="55"></igc-virtual-scroll>
      </igc-list>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
