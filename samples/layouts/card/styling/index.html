<!DOCTYPE html>
<html>

<head>
  <title>Card Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="container sample">
      <igc-card class="balance-card">
        <igc-chip class="trend-chip">
          <igc-icon slot="prefix" name="trending-up" collection="material"></igc-icon>
          <span>+12.4%</span>
        </igc-chip>
        <igc-card-header>
          <span slot="title">Total balance</span>
        </igc-card-header>
        <igc-card-content>
          <span class="balance-amount">$24,860</span>
        </igc-card-content>
        <igc-card-actions>
          <div slot="end" class="balance-actions">
            <igc-icon-button
              variant="flat"
              name="link"
              collection="material"
              aria-label="Copy account link"></igc-icon-button>
            <igc-icon-button
              variant="flat"
              name="more-vert"
              collection="material"
              aria-label="More options"></igc-icon-button>
          </div>
        </igc-card-actions>
      </igc-card>

      <igc-card class="support-card">
        <igc-chip class="support-tag">Support</igc-chip>
        <igc-card-media class="support-media">
          <img
            src="https://dl.infragistics.com/x/img/card/card-3.png"
            alt="Support agent reviewing system dashboards on a laptop" />
        </igc-card-media>
        <igc-card-header>
          <span slot="title">Review the issue and check system logs</span>
        </igc-card-header>
        <igc-card-actions>
          <span class="support-link">Find out more</span>
        </igc-card-actions>
      </igc-card>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
