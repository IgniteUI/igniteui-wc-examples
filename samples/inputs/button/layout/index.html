<!DOCTYPE html>
<html>
  <head>
    <title>Button Layout</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root">
      <div class="container sample">
        <div class="button-container">
          <div class="button-item">
            <igc-button variant="outlined"><igc-icon slot="prefix" name="add" collection="material"></igc-icon>Add</igc-button>
          </div>
          <div class="button-item"><igc-button variant="outlined">Buy Now</igc-button></div>
          <div class="button-item">
            <igc-button variant="outlined">Add<igc-icon slot="suffix" name="add" collection="material"></igc-icon></igc-button>
          </div>
          <div class="button-item">
            <igc-button variant="outlined"><igc-icon slot="prefix" name="add" collection="material"></igc-icon>Floating Action</igc-button>
          </div>
          <div class="button-item"><igc-button variant="outlined"><igc-icon name="add" collection="material"></igc-icon></igc-button></div>
          <div class="button-item"><igc-button variant="outlined">Floating Action</igc-button></div>
        </div>
      </div>
    </div>
    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %><script src="src/index.ts"></script><% } %>

  </body>
</html>
