<!DOCTYPE html>
<html>
  <head>
    <title>Button Interaction States</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root">
      <div class="container sample">
        <div class="button-container">
          <div class="button-item">
            <span class="button-label">Idle</span>
            <igc-button variant="contained" class="idle">
              <igc-icon slot="prefix" name="notifications" collection="material"></igc-icon>
              Contained
              <igc-icon slot="suffix" name="notifications" collection="material"></igc-icon>
            </igc-button>
          </div>
          <div class="button-item">
            <span class="button-label">Hover</span>
            <igc-button variant="contained" class="state-hover">
              <igc-icon slot="prefix" name="notifications" collection="material"></igc-icon>
              Contained
              <igc-icon slot="suffix" name="notifications" collection="material"></igc-icon>
            </igc-button>
          </div>
          <div class="button-item">
            <span class="button-label">Focused</span>
            <igc-button variant="contained" class="state-focused">
              <igc-icon slot="prefix" name="notifications" collection="material"></igc-icon>
              Contained
              <igc-icon slot="suffix" name="notifications" collection="material"></igc-icon>
            </igc-button>
          </div>
          <div class="button-item">
            <span class="button-label">Focused &amp; Hover</span>
            <igc-button variant="contained" class="state-focused-hover">
              <igc-icon slot="prefix" name="notifications" collection="material"></igc-icon>
              Contained
              <igc-icon slot="suffix" name="notifications" collection="material"></igc-icon>
            </igc-button>
          </div>
        </div>
      </div>
    </div>
    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %><script src="src/index.ts"></script><% } %>

  </body>
</html>
