<!DOCTYPE html>
<html>

<head>
  <title>Switch Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="container sample">
      <div class="security">
        <div class="security__header">
          <igc-switch label-position="before" checked>
            <span class="option">
              <span class="option__label">Two-factor authentication</span>
              <span class="option__hint">Extra sign-in verification</span>
            </span>
          </igc-switch>
        </div>
        <div class="security__body">
          <igc-radio-group alignment="vertical">
            <igc-radio name="method" value="app" checked>Authenticator app</igc-radio>
            <igc-radio name="method" value="key">Security key</igc-radio>
            <igc-radio name="method" value="codes">Backup codes</igc-radio>
          </igc-radio-group>
        </div>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
