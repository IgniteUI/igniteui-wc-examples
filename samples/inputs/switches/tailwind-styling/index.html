<!DOCTYPE html>
<html>

<head>
  <title>Switch Tailwind Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="container sample">
      <div id="dashboard-card" class="dark w-full max-w-[384px] overflow-hidden rounded-lg shadow-[var(--ig-elevation-2)] bg-white dark:bg-[#1A314A]">
        <div class="flex items-center justify-between gap-4 border-b px-6 py-4 border-gray-200 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
          <span class="font-sans text-[14px] font-medium leading-6 tracking-[0.1px] text-gray-900 dark:text-[#E6F2FF]">Dashboard</span>
          <igc-switch id="dark-mode-switch" label-position="before" checked class="[--track-on-color:var(--color-blue-500)] [--track-off-color:var(--color-slate-600)] [--thumb-on-color:var(--color-white)] [--thumb-off-color:var(--color-slate-300)] [--track-on-hover-color:var(--color-blue-600)]">
            <span class="flex items-center gap-2 font-sans text-[14px] font-medium leading-6 tracking-[0.1px] text-gray-700 dark:text-[#E6F2FF]">
              <igc-icon name="dark_mode" collection="material" class="[--size:20px] text-[var(--ig-warn-300)]"></igc-icon>
              Dark mode
            </span>
          </igc-switch>
        </div>
        <div class="px-6 py-4 bg-white dark:bg-[#1A314A]">
          <h6 class="m-0 font-sans text-[16px] font-semibold leading-6 text-gray-900 dark:text-gray-50">Revenue overview</h6>
          <p class="m-0 mt-2 font-sans text-[14px] font-medium leading-5 tracking-[0.25px] text-gray-600 dark:text-gray-400">
            $84,290 this month, up 12% from July.<br />
            Your top-performing channel is Direct, driving 41% of total revenue.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
