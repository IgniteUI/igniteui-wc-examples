<!DOCTYPE html>
<html>

<head>
  <title>Badge Size</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="badge-size">
      <div class="badge-size-row badge-small">
        <span class="row-label">Small</span>
        <igc-badge dot variant="danger"></igc-badge>
        <igc-badge variant="info">2</igc-badge>
        <igc-badge variant="success">
          <igc-icon name="check" collection="material"></igc-icon>
        </igc-badge>
      </div>
      <div class="badge-size-row badge-medium">
        <span class="row-label">Medium</span>
        <igc-badge dot variant="danger"></igc-badge>
        <igc-badge variant="info">2</igc-badge>
        <igc-badge variant="success">
          <igc-icon name="check" collection="material"></igc-icon>
        </igc-badge>
      </div>
      <div class="badge-size-row badge-large">
        <span class="row-label">Large</span>
        <igc-badge dot variant="danger"></igc-badge>
        <igc-badge variant="info">2</igc-badge>
        <igc-badge variant="success">
          <igc-icon name="check" collection="material"></igc-icon>
        </igc-badge>
      </div>
    </div>
  </div>

  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>
</body>

</html>
