<!DOCTYPE html>
<html>

<head>
  <title>Badge Overview</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="badge-overview">
      <div class="badge-example avatar-example">
        <igc-avatar src="https://dl.infragistics.com/x/img/avatars/avatar-profile-04.png" shape="circle" size="small"></igc-avatar>
        <igc-badge outlined variant="success">
          <igc-icon name="check" collection="material"></igc-icon>
        </igc-badge>
      </div>
      <div class="badge-example icon-example">
        <igc-icon name="mail" collection="material"></igc-icon>
        <igc-badge outlined variant="danger">2</igc-badge>
      </div>
      <div class="badge-example event-example">
        <igc-chip>Events</igc-chip>
        <igc-badge outlined variant="info">new</igc-badge>
      </div>
      <div class="badge-example notification-example">
        <igc-icon name="notifications" collection="material"></igc-icon>
        <igc-badge dot outlined variant="danger"></igc-badge>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
