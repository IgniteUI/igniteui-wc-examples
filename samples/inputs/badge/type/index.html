<!DOCTYPE html>
<html>

<head>
  <title>Badge Type</title>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="badge-type">
      <div class="badge-type-item">
        <span>Number</span>
        <igc-badge variant="primary">12</igc-badge>
      </div>
      <div class="badge-type-item">
        <span>Icon</span>
        <igc-badge variant="primary">
          <svg class="badge-check" viewBox="0 0 24 24" aria-label="check">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
        </igc-badge>
      </div>
      <div class="badge-type-item">
        <span>Dot</span>
        <igc-badge variant="primary" dot></igc-badge>
      </div>
    </div>
  </div>

  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>
</body>

</html>
