<!DOCTYPE html>
<html>

<head>
    <title>QR Code Logo</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />

</head>

<body>
    <div id="root">
        <div class="container sample">
            <igc-qr-code value="https://www.infragistics.com/" logo-size="1" error-level="H"
                logo-src="https://static.infragistics.com/marketing/Website/products/ignite-ui/shared/ignite-ui-logo-light-background-horizontal.svg"></igc-qr-code>
        </div>
    </div>
    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %>
        <script src="src/index.ts"></script>
        <% } %>

</body>

</html>
