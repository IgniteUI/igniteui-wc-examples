<!DOCTYPE html>
<html>
<head>
    <title>Color Picker Styling</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>
<body>
    <div id="root">
        <div class="container sample" style="align-items: center;">
            <div class="editor-toolbar" id="editorToolbar">
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Text</span>
                    <div class="toolbar-actions">
                        <igc-icon-button variant="flat" name="text-color" aria-label="Text color"></igc-icon-button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Alignment</span>
                    <div class="toolbar-actions" data-single-select="true">
                        <igc-icon-button variant="flat" name="align-justify" aria-label="Justify"></igc-icon-button>
                        <igc-icon-button variant="flat" name="align-right" aria-label="Align right"></igc-icon-button>
                        <igc-icon-button variant="flat" name="align-center" aria-label="Align center"></igc-icon-button>
                        <igc-icon-button variant="flat" name="align-left" aria-label="Align left"></igc-icon-button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Content</span>
                    <div class="toolbar-actions">
                        <igc-icon-button variant="flat" name="shapes" aria-label="Shapes"></igc-icon-button>
                        <igc-icon-button variant="flat" name="image" aria-label="Image"></igc-icon-button>
                        <igc-icon-button variant="flat" name="layout" aria-label="Layout"></igc-icon-button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Charts</span>
                    <div class="toolbar-actions">
                        <igc-icon-button variant="flat" name="bar-chart" aria-label="Bar chart"></igc-icon-button>
                    </div>
                </div>
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Colors</span>
                    <div class="toolbar-actions">
                        <igc-color-picker id="colorPicker" mode="input" placeholder="Color"></igc-color-picker>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %>
        <script src="src/index.ts"></script>
        <% } %>
</body>
</html>
