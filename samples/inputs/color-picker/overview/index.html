<!DOCTYPE html>
<html>
<head>
    <title>Color Picker Overview</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />

</head>
<body>
    <div id="root">
        <div class="container sample" style="align-items: center;">
            <igc-card class="wizard-card">
                <igc-card-content>
                    <h2>Choose your interior color</h2>
                    <igc-select label="Type of wall paints" value="satin" outlined>
                        <igc-select-item value="matte">Matte</igc-select-item>
                        <igc-select-item value="satin">Satin</igc-select-item>
                        <igc-select-item value="eggshell">Eggshell</igc-select-item>
                        <igc-select-item value="gloss">Gloss</igc-select-item>
                    </igc-select>
                    <igc-select label="Paint quantity" value="3l" outlined>
                        <igc-select-item value="1l">1 litre</igc-select-item>
                        <igc-select-item value="3l">3 litres</igc-select-item>
                        <igc-select-item value="5l">5 litres</igc-select-item>
                        <igc-select-item value="10l">10 litres</igc-select-item>
                    </igc-select>
                    <div class="color-row">
                        <igc-color-picker mode="input" value="#0598fa"></igc-color-picker>
                        <igc-icon-button id="colorReset" name="refresh" collection="material"
                            variant="flat"></igc-icon-button>
                    </div>
                </igc-card-content>
                <igc-card-actions>
                    <igc-button variant="flat">Back</igc-button>
                    <div class="stepper">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot active"></span>
                    </div>
                    <igc-button variant="flat">Confirm</igc-button>
                </igc-card-actions>
            </igc-card>
        </div>
    </div>
    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %>
        <script src="src/index.ts"></script>
        <% } %>
</body>
</html>
