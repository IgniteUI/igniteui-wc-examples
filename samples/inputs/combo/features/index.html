<!DOCTYPE html>
<html>

<head>
  <title>Combo Features</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample combo-features">
      <div class="combo-column">
        <igc-combo id="combo" outlined label="Location" placeholder-search="Search…" value-key="id" display-key="name"></igc-combo>

        <div class="selection-panel">
          <span class="selection-title" id="selection-title">Selection</span>
          <ul class="selection-list" id="selection-list" aria-labelledby="selection-title" hidden></ul>
          <span class="selection-empty" id="selection-empty">No items selected</span>
        </div>
      </div>

      <div class="controls">
        <igc-switch id="disable-filtering">Disable Filtering</igc-switch>
        <igc-switch id="case-sensitive-icon">Show Case-sensitive Icon</igc-switch>
        <igc-switch id="grouping">Enable Grouping</igc-switch>
        <igc-switch id="disabled">Disable Combo</igc-switch>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
