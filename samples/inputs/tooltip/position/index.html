<!DOCTYPE html>
<html>

<head>
  <title>Tooltip Position</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <div class="positions">
        <div id="top" class="target"></div>
        <div id="left" class="target"></div>
        <div id="right" class="target"></div>
        <div id="bottom" class="target"></div>
      </div>
      <igc-tooltip anchor="top" placement="top" with-arrow open>Tooltip message Top</igc-tooltip>
      <igc-tooltip anchor="left" placement="left" with-arrow open>Tooltip message Left</igc-tooltip>
      <igc-tooltip anchor="right" placement="right" with-arrow open>Tooltip message Right</igc-tooltip>
      <igc-tooltip anchor="bottom" placement="bottom" with-arrow open>Tooltip message Bottom</igc-tooltip>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>

</body>
</html>
