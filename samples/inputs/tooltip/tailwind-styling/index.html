<!DOCTYPE html>
<html>

<head>
  <title>Tooltip Tailwind Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <div class="flex flex-wrap items-start justify-center gap-25 pt-14 max-[52rem]:gap-x-10 max-[46.25rem]:gap-y-4 max-[46.25rem]:pt-0">
        <igc-list id="btc" class="mt-10.5 w-65 overflow-hidden rounded-full border border-btc-border max-[46.25rem]:mt-0">
          <igc-list-item class="px-4 py-2 [&::part(start)]:hidden">
            <span slot="title" class="flex items-center gap-1 font-[aktiv-grotesk,sans-serif] text-sm/[1.125rem] font-semibold text-btc-ink">
              <igc-icon name="bitcoin" collection="material" class="text-btc-icon"></igc-icon>
              BTC
            </span>
            <span slot="end" class="font-[aktiv-grotesk,sans-serif] text-sm/5 font-medium tracking-[0.25px] text-btc-accent">
              Daily: + 2,6%
            </span>
          </igc-list-item>
        </igc-list>
        <igc-tooltip
          anchor="btc"
          placement="bottom-start"
          sticky
          class="[--ig-tooltip-background:white] [--ig-tooltip-text-color:var(--color-btc-text)] [--ig-tooltip-border-radius:1rem] [&::part(base)]:w-65 [&::part(base)]:border [&::part(base)]:border-btc-border [&::part(base)]:p-4 [&::part(close-button)]:text-btc-muted">
          <div class="flex flex-1 flex-col gap-2 p-2">
            <span class="flex items-center gap-2.5 text-xl/6 font-semibold tracking-[0.15px]">
              BTC
              <igc-icon name="bitcoin" collection="material" class="text-btc-icon"></igc-icon>
            </span>
            <span class="flex flex-col gap-0.5">
              <span class="text-xs/4 font-semibold tracking-[0.15px] text-btc-exchange">Exchange Balance</span>
              <span class="font-[aktiv-grotesk,sans-serif] text-sm/6 font-medium tracking-[0.1px]">USD 81,459.00</span>
            </span>
            <span class="flex flex-col gap-0.5">
              <span class="text-xs/4 font-semibold tracking-[0.15px] text-btc-accent">Assets Balance</span>
              <span class="font-[aktiv-grotesk,sans-serif] text-sm/6 font-medium tracking-[0.1px]">USD 46,287.90</span>
            </span>
          </div>
        </igc-tooltip>
        <div id="portfolio" class="relative me-55 size-50.75">
          <igc-pie-chart
            id="pie-chart"
            width="100%"
            height="100%"
            value-member-path="share"
            label-member-path="asset"
            labels-position="None"
            radius-factor="1"
            start-angle="-90"
            brushes="#cce4ff #66adff #99c9ff"
            outlines="#cce4ff #66adff #99c9ff">
          </igc-pie-chart>
          <span id="portfolio-anchor" class="absolute top-1/2 left-33.75"></span>
        </div>
        <igc-tooltip
          id="portfolio-tooltip"
          anchor="portfolio-anchor"
          placement="bottom-start"
          offset="0"
          class="pointer-events-none [--ig-tooltip-background:white] [--ig-tooltip-border-radius:0] [&::part(base)]:border [&::part(base)]:border-chart-border [&::part(base)]:p-4">
          <div class="h-34 w-63.75">
            <igc-category-chart
              id="balance-chart"
              width="100%"
              height="100%"
              chart-type="SplineArea"
              included-properties="period, exchange, assets"
              brushes="#ff885c #66adff"
              outlines="#ff885c #66adff"
              area-fill-opacity="0.5"
              thickness="1.5"
              marker-types="None"
              tool-tip-type="None"
              is-horizontal-zoom-enabled="false"
              is-vertical-zoom-enabled="false"
              x-axis-interval="2"
              x-axis-stroke="#7d91ab"
              x-axis-tick-stroke="#7d91ab"
              x-axis-tick-length="8"
              x-axis-label-text-color="#7d91ab"
              x-axis-label-text-style="400 10px 'Titillium Web'"
              y-axis-minimum-value="0"
              y-axis-maximum-value="60"
              y-axis-interval="20"
              y-axis-minor-interval="10"
              y-axis-major-stroke="#d2dbe8"
              y-axis-minor-stroke="#d2dbe8"
              y-axis-label-text-color="#7d91ab"
              y-axis-label-text-style="400 10px 'Titillium Web'">
            </igc-category-chart>
          </div>
        </igc-tooltip>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>

</body>
</html>
