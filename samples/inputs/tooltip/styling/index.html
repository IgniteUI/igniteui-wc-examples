<!DOCTYPE html>
<html>

<head>
  <title>Tooltip Styling</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <igc-list id="status" class="trigger">
        <igc-list-item>
          <div slot="start" class="avatar">
            <igc-avatar src="https://dl.infragistics.com/x/img/avatars/avatar-profile-03.png" shape="circle" alt="Aron Watson"></igc-avatar>
            <igc-badge variant="danger">
              <igc-icon name="block" collection="material"></igc-icon>
            </igc-badge>
          </div>
          <span slot="title">Aron Watson</span>
        </igc-list-item>
      </igc-list>
      <igc-tooltip anchor="status" placement="bottom-end" with-arrow class="status-tooltip">
        <igc-icon name="block" collection="material"></igc-icon>
        <span>
          My notifications are silenced to focus. Urgent matters only, please,
          otherwise I'll reply when I'm free.
        </span>
      </igc-tooltip>
      <igc-date-picker id="registration" class="registration" outlined placeholder="First Registration"></igc-date-picker>
      <igc-tooltip anchor="registration" placement="bottom-end" class="hint-tooltip" message="The date when your car was first registered"></igc-tooltip>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>

</body>
</html>
