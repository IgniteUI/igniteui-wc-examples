<!DOCTYPE html>
<html>

<head>
  <title>Tooltip Arrow Position</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <div class="placements">
        <div class="placement">
          <span class="placement-label">Arrow Top</span>
          <div class="placement-area top">
            <span id="top" class="anchor center"></span>
          </div>
          <igc-tooltip anchor="top" placement="top" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Top Start</span>
          <div class="placement-area top">
            <span id="top-start" class="anchor start"></span>
          </div>
          <igc-tooltip anchor="top-start" placement="top-start" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Top End</span>
          <div class="placement-area top">
            <span id="top-end" class="anchor end"></span>
          </div>
          <igc-tooltip anchor="top-end" placement="top-end" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Left</span>
          <div class="placement-area left">
            <span id="left" class="anchor center"></span>
          </div>
          <igc-tooltip anchor="left" placement="left" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Left Start</span>
          <div class="placement-area left">
            <span id="left-start" class="anchor start"></span>
          </div>
          <igc-tooltip anchor="left-start" placement="left-start" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Left End</span>
          <div class="placement-area left">
            <span id="left-end" class="anchor end"></span>
          </div>
          <igc-tooltip anchor="left-end" placement="left-end" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Right</span>
          <div class="placement-area right">
            <span id="right" class="anchor center"></span>
          </div>
          <igc-tooltip anchor="right" placement="right" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Right Start</span>
          <div class="placement-area right">
            <span id="right-start" class="anchor start"></span>
          </div>
          <igc-tooltip anchor="right-start" placement="right-start" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Right End</span>
          <div class="placement-area right">
            <span id="right-end" class="anchor end"></span>
          </div>
          <igc-tooltip anchor="right-end" placement="right-end" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Bottom</span>
          <div class="placement-area bottom">
            <span id="bottom" class="anchor center"></span>
          </div>
          <igc-tooltip anchor="bottom" placement="bottom" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Bottom Start</span>
          <div class="placement-area bottom">
            <span id="bottom-start" class="anchor start"></span>
          </div>
          <igc-tooltip anchor="bottom-start" placement="bottom-start" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
        <div class="placement">
          <span class="placement-label">Arrow Bottom End</span>
          <div class="placement-area bottom">
            <span id="bottom-end" class="anchor end"></span>
          </div>
          <igc-tooltip anchor="bottom-end" placement="bottom-end" with-arrow open message="This is a tooltip message. This tooltip shows a long message."></igc-tooltip>
        </div>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>

</body>
</html>
