<!DOCTYPE html>
<html>

<head>
  <title>Tooltip Overview</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <div class="settings">
        <igc-radio-group alignment="horizontal">
          <igc-radio name="placement" value="top">Top</igc-radio>
          <igc-radio name="placement" value="right">Right</igc-radio>
          <igc-radio name="placement" value="left">Left</igc-radio>
          <igc-radio name="placement" value="bottom" checked>Bottom</igc-radio>
        </igc-radio-group>
        <igc-switch id="close-button" label-position="before" checked>Close Button</igc-switch>
        <igc-switch id="arrow" label-position="before" checked>Arrow</igc-switch>
      </div>
      <div id="target" class="target"></div>
      <igc-tooltip id="tooltip" anchor="target" placement="bottom" with-arrow sticky open>
        This is a tooltip message
        <br />
        Multiline message here.
      </igc-tooltip>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>

</body>
</html>
