<!DOCTYPE html>
<html>
  <head>
    <title>Button Group States</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root" class="states-container">
      <div class="states-matrix">
        <header class="states-row">
          <span class="row-label"></span>
          <span class="column-label">Idle</span>
          <span class="column-label">Hover</span>
          <span class="column-label">Focused</span>
        </header>
        <section class="states-row">
          <span class="row-label">Selected / Off</span>
          <igc-button-group>
            <igc-toggle-button class="state-idle" value="button">
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
          <igc-button-group>
            <igc-toggle-button class="state-hover" value="button">
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
          <igc-button-group>
            <igc-toggle-button class="state-focused" value="button">
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        </section>
        <section class="states-row">
          <span class="row-label">Selected / On</span>
          <igc-button-group>
            <igc-toggle-button class="state-idle" value="button" selected>
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
          <igc-button-group>
            <igc-toggle-button class="state-hover" value="button" selected>
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
          <igc-button-group>
            <igc-toggle-button class="state-focused" value="button" selected>
              <igc-icon name="notifications" collection="material"></igc-icon>
              Button
              <igc-icon name="notifications" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        </section>
      </div>
    </div>
  </body>
</html>
