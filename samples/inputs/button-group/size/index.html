<!DOCTYPE html>
<html>
  <head>
    <title>Button Group Size</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root" class="states-container">
      <div class="button-group-size">
        <span class="sample-label">Small</span>
           <igc-button-group>
            <igc-toggle-button value="sofia">
              Sofia
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="london">
              London
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="new york">
              New York
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        <span class="sample-label">Medium</span>
          <igc-button-group>
            <igc-toggle-button value="sofia">
              Sofia
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="london">
              London
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="new york">
              New York
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        <span class="sample-label">Large</span>
          <igc-button-group>
            <igc-toggle-button value="sofia">
              Sofia
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="london">
              London
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="new york">
              New York
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
      </div>
    </div>
  </body>
</html>
