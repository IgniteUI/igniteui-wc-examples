<!DOCTYPE html>
<html>

<head>
  <title>Button Group Layout</title>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="container sample">
      <igc-button-group>
        <igc-toggle-button>
          Left
          <igc-ripple></igc-ripple>
        </igc-toggle-button>
        <igc-toggle-button>
          Center
          <igc-ripple></igc-ripple>
        </igc-toggle-button>
        <igc-toggle-button>
          Right
          <igc-ripple></igc-ripple>
        </igc-toggle-button>
        <igc-toggle-button selected>
          Justify
          <igc-ripple></igc-ripple>
        </igc-toggle-button>
      </igc-button-group>
    </div>
  </div>

  <% if (false) { %>
    <script src="src/index.ts"></script>
  <% } %>
</body>

</html>
