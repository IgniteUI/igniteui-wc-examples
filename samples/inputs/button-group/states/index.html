<!DOCTYPE html>
<html>
  <head>
    <title>Button Group States</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root" class="states-container">
      <div class="states-matrix">
        <header class="states-row">
          <span class="row-label"></span>
          <span class="column-label">Enabled</span>
          <span class="column-label">Disabled</span>
        </header>
        <section class="states-row">
          <span class="row-label">Selected / Off</span>
          <div class="state-cell">
            <span class="cell-label">Enabled</span>
            <igc-button-group selection="multiple">
              <igc-toggle-button value="device">
              Device
              <igc-ripple></igc-ripple>
              </igc-toggle-button>
            </igc-button-group>
          </div>
          <div class="state-cell">
            <span class="cell-label">Disabled</span>
            <igc-button-group selection="multiple">
              <igc-toggle-button value="cloud" disabled>Cloud</igc-toggle-button>
            </igc-button-group>
          </div>
        </section>
        <section class="states-row">
          <span class="row-label">Selected / On</span>
          <div class="state-cell">
            <span class="cell-label">Enabled</span>
            <igc-button-group selection="multiple">
              <igc-toggle-button value="device" selected>
              Device
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            </igc-button-group>
          </div>
          <div class="state-cell">
            <span class="cell-label">Disabled</span>
            <igc-button-group selection="multiple">
              <igc-toggle-button value="cloud" disabled selected>Cloud</igc-toggle-button>
            </igc-button-group>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
