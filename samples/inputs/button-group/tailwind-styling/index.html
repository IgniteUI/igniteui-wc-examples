<!DOCTYPE html>
<html>
  <head>
    <title>Button Group Tailwind Styling</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root">
      <div class="states-container">
        <igc-button-group class="![--elevation:0] ![--item-text-color:#6d28d9] ![--item-background:#ffffff] ![--item-border-color:#c4b5fd] ![--item-hover-text-color:#6d28d9] ![--item-hover-background:#fae8ff] ![--item-hover-border-color:#c4b5fd] ![--item-selected-text-color:#ffffff] ![--item-selected-background:#7c3aed] ![--item-selected-border-color:#c4b5fd] ![--item-selected-hover-text-color:#ffffff] ![--item-selected-hover-background:#7c3aed]">
          <igc-toggle-button value="day">
            Day
            <igc-ripple></igc-ripple>
          </igc-toggle-button>
          <igc-toggle-button value="week" selected>
            Week
            <igc-ripple></igc-ripple>
          </igc-toggle-button>
          <igc-toggle-button value="month">
            Month
            <igc-ripple></igc-ripple>
          </igc-toggle-button>
        </igc-button-group>
      </div>
    </div>
  </body>
</html>
