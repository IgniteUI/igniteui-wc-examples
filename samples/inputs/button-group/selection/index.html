<!DOCTYPE html>
<html>
  <head>
    <title>Button Group Selection</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
  </head>

  <body>
    <div id="root" class="states-container">
      <div class="selection-samples">
        <span class="sample-label">Single</span>
           <igc-button-group selection="single">
            <igc-toggle-button value="bold">
              <igc-icon name="bold" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="italic">
              <igc-icon name="italic" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="underlined">
              <igc-icon name="underlined" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        <span class="sample-label">Single-Required</span>
          <igc-button-group selection="single-required">
            <igc-toggle-button value="bold" selected>
              <igc-icon name="bold" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="italic">
              <igc-icon name="italic" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="underlined">
              <igc-icon name="underlined" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
        <span class="sample-label">Multiple</span>
          <igc-button-group selection="multiple">
            <igc-toggle-button value="bold" selected>
              <igc-icon name="bold" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="italic" selected>
              <igc-icon name="italic" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
            <igc-toggle-button value="underlined">
              <igc-icon name="underlined" collection="material"></igc-icon>
              <igc-ripple></igc-ripple>
            </igc-toggle-button>
          </igc-button-group>
      </div>
    </div>
  </body>
</html>
