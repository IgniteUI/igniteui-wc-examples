<!DOCTYPE html>
<html>

<head>
  <title>Chip Overview</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" type="text/css" />
</head>

<body>
  <div id="root">
    <div class="sample">
      <div class="profile-card">
        <div>
          <span class="section-header" id="name-header">Name</span>
          <igc-input class="name-input" outlined value="Jordan Lee" aria-labelledby="name-header"></igc-input>
        </div>
        <div>
          <span class="section-header" id="skills-header">Skills · 0 selected</span>
          <div class="skills" role="group" aria-labelledby="skills-header">
            <igc-chip class="skill" outlined selectable>Figma</igc-chip>
            <igc-chip class="skill" outlined selectable>React</igc-chip>
            <igc-chip class="skill" outlined selectable>CSS</igc-chip>
            <igc-chip class="skill" outlined selectable>Prototyping</igc-chip>
            <igc-chip class="skill" outlined selectable>Motion Design</igc-chip>
          </div>
        </div>
        <div class="actions">
          <igc-button>Save profile</igc-button>
        </div>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>

</body>

</html>
