<!DOCTYPE html>
<html>
  <head>
    <title>Sample | Ignite UI | Web Components | infragistics</title>
    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png" >
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
    <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" />
    <link rel="stylesheet" href="/src/index.css" type="text/css" />

  </head>

  <body>
    <div id="root">

<div class="container sample ig-typography">

    <div class="editing-controls" role="group" aria-label="Editing event cancellation">
        <label><input type="checkbox" role="switch" name="rowEditEnter"> cancel rowEditEnter</label>
        <label><input type="checkbox" role="switch" name="cellEditEnter"> cancel cellEditEnter</label>
        <label><input type="checkbox" role="switch" name="cellEdit"> cancel cellEdit</label>
        <label><input type="checkbox" role="switch" name="rowEdit"> cancel rowEdit</label>
    </div>
    <div class="editing-layout">
        <igc-grid
        auto-generate="false"
        name="grid"
        height="100%"
        id="grid"
        row-editable="true"
        primary-key="ProductID">
            <igc-column
            field="ProductName"
            header="Product Name">
            </igc-column>
            <igc-column
            field="UnitPrice"
            header="Unit Price">
            </igc-column>
            <igc-column
            field="UnitsInStock"
            header="Units In Stock">
            </igc-column>
            <igc-column
            field="Ordered">
            </igc-column>
        </igc-grid>
        <section class="event-panel" aria-labelledby="event-log-title">
            <header><span id="event-log-title">Events execution sequence</span>
                <button id="clear-log" type="button"><span aria-hidden="true">&times;</span> Clear log</button>
            </header>
            <div id="event-log" role="log" aria-labelledby="event-log-title" tabindex="0"></div>
        </section>
    </div>
</div>

    </div>

    <!-- This script is needed only for parcel and it will be excluded for webpack -->
    <% if (false) { %><script src="src/index.ts"></script><% } %>
  </body>
</html>
