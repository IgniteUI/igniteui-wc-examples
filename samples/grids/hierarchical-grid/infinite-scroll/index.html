<!DOCTYPE html>
<html>

<head>
  <title>Sample | Ignite UI | Web Components | infragistics</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" />
  <link rel="stylesheet" href="/src/index.css" type="text/css" />

</head>

<body>
  <div id="root">
    <div class="container sample">
      <div class="container fill">

        <igc-hierarchical-grid
          id="grid"
          aria-label="Customers and orders"
          primary-key="customerId"
          height="480px"
          auto-generate="false"
        >
          <igc-column field="companyName" header="Company"></igc-column>
          <igc-column field="contactName" header="Contact"></igc-column>
          <igc-column field="address.country" header="Country"></igc-column>

          <igc-row-island id="orders" child-data-key="Orders" primary-key="orderId" auto-generate="false">
            <igc-column field="orderId" header="Order ID" data-type="number"></igc-column>
            <igc-column field="shipAddress.city" header="Ship City"></igc-column>
          </igc-row-island>
        </igc-hierarchical-grid>

      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>
</body>

</html>
