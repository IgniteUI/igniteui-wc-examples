<!DOCTYPE html>
<html>

<head>
  <title>Sample | Ignite UI | Web Components | infragistics</title>
  <meta charset="UTF-8" />

  <link rel="shortcut icon" href="https://dl.infragistics.com/x/img/browsers/wc.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium Web" />
  <link rel="stylesheet" href="https://dl.infragistics.com/x/css/samples/shared.v8.css" />
  <link rel="stylesheet" href="/src/index.css" type="text/css" />

</head>

<body>
  <div id="root">
    <div class="container sample">
      <div class="row-drag-demo">
        <div id="dropArea" class="drop-area">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" />
          </svg>
          <span>Drag a row here to delete it</span>
        </div>
        <igc-hierarchical-grid row-draggable="true" id="grid" aria-label="Artists"
                               auto-generate="false" primary-key="ID" height="100%">
          <igc-column field="Artist" header="Artist"></igc-column>
          <igc-column field="Genre" header="Genre"></igc-column>
          <igc-row-island child-data-key="Albums" auto-generate="false">
            <igc-column field="Album" header="Album"></igc-column>
          </igc-row-island>
        </igc-hierarchical-grid>
      </div>
    </div>
  </div>

  <!-- This script is needed only for parcel and it will be excluded for webpack -->
  <% if (false) { %>
    <script src="src/index.ts"></script>
    <% } %>
</body>

</html>
